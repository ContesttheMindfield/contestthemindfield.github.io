{{- $page := .page -}}
<li id="is-translated">
    {{ partial "l10n.html" (dict "page" $page) }}
</li>
{{- range $page.Ancestors.Reverse }}
    {{- if not .IsHome }}
        <li>
            <a href="{{ .Permalink }}">{{ .Title }}</a>
        </li>
    {{- end }}
{{- end }}
<li>
    <a href="{{ $page.Permalink }}" aria-current="page" tabindex="-1">{{ $page.Title }}</a>
</li>
